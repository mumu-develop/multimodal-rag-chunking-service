[project]
name = "multimodal-rag-chunking-service"
version = "0.3.0"
description = "Multimodal RAG Chunking Service - FastAPI backend for document parsing, chunking, and vector storage"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings>=2.10.1",
    "python-multipart==0.0.9",
    # Async task queue
    "celery==5.4.0",
    "redis==5.1.0",
    # Database - MySQL
    "sqlalchemy==2.0.35",
    "pymysql==1.1.1",
    "alembic==1.13.3",
    # Vector database
    "pymilvus>=2.5.0",
    # Document parsing
    "unstructured[pdf,docx,pptx]==0.15.0",
    "langchain-text-splitters>=0.3.0",
    "PyMuPDF==1.24.0",  # PDF to image conversion for OCR
    # OCR (OpenAI-compatible API)
    "openai>=1.0.0",  # OCR client uses OpenAI chat.completions format
    # Embedding models
    "dashscope>=1.20.0",
    "PyMuPDF==1.24.0",
    "FlagEmbedding==1.2.11",
    "jieba==0.42.1",
    # Token counting (借鉴 RAGFlow)
    "tiktoken>=0.7.0",
    # Utilities
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
eval = [
    "ragas>=0.2.0",
    "langchain-openai>=0.2.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "ocr_real: OCR integration tests requiring real OCR service",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]